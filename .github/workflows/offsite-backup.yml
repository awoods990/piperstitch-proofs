# The third copy. GitHub holds the code, the marketing site, the videos
# and the history; this puts a complete, self-contained mirror of all of
# it in the same bucket the two services back themselves up to — so the
# answer to "what if Railway is gone?" and "what if GitHub is gone?" is
# the same bucket, not a shrug.
#
# A git bundle is the whole repository in one file: clone it back with
# `git clone piperstitch.bundle piperstitch` and you have every commit,
# branch and tag, offline.
name: offsite-backup
on:
  schedule:
    - cron: "30 4 * * 0"        # Sundays, after the services have taken theirs
  workflow_dispatch:

jobs:
  bundle:
    name: Mirror the repository off-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # every commit, or it isn't a backup

      - name: Build the bundle
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          git bundle create "piperstitch-proofs-${stamp}.bundle" --all
          sha256sum "piperstitch-proofs-${stamp}.bundle" > "piperstitch-proofs-${stamp}.bundle.sha256"
          ls -lh "piperstitch-proofs-${stamp}.bundle"
          echo "STAMP=${stamp}" >> "$GITHUB_ENV"

      - name: Put it in the bucket
        env:
          # Whichever name these were saved under. The bucket arrived while
          # these did not, which means the names differ rather than the
          # secrets being absent.
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY || secrets.BACKUP_ACCESS_KEY_ID || secrets.SPACES_ACCESS_KEY || secrets.SPACES_KEY || secrets.AWS_ACCESS_KEY_ID || secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_KEY || secrets.BACKUP_SECRET_ACCESS_KEY || secrets.SPACES_SECRET_KEY || secrets.SPACES_SECRET || secrets.AWS_SECRET_ACCESS_KEY || secrets.DO_SPACES_SECRET }}
          NAMED_BACKUP_ACCESS_KEY: ${{ secrets.BACKUP_ACCESS_KEY != '' }}
          NAMED_SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY != '' }}
          NAMED_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_REGION || vars.BACKUP_REGION || 'us-east-1' }}
          ENDPOINT: ${{ secrets.BACKUP_ENDPOINT || vars.BACKUP_ENDPOINT }}
          BUCKET: ${{ secrets.BACKUP_BUCKET || vars.BACKUP_BUCKET }}
          # DigitalOcean Spaces (and most S3-compatible services) reject the
          # checksum headers AWS CLI v2.23+ began sending by default. Our own
          # uploader signs plain PUTs, which is why the services back up
          # happily while this step did not.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -uo pipefail          # not -e: we want to explain a failure, not vanish on it
          if [ -z "${BUCKET:-}" ]; then
            echo "::warning::No bucket configured — add the BACKUP_* secrets to this repository."
            exit 0
          fi

          # Say what we are about to do, and how long each secret is —
          # never the values. A secret pasted with a stray space or
          # missing entirely is the usual reason this step fails in one
          # repository while working in another.
          {
            echo "### Off-platform mirror"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Endpoint | \`${ENDPOINT:-(empty)}\` |"
            echo "| Bucket | \`${BUCKET:-(empty)}\` |"
            echo "| Region | \`${AWS_DEFAULT_REGION:-(empty)}\` |"
            echo "| Access key | ${#AWS_ACCESS_KEY_ID} characters |"
            echo "| Secret key | ${#AWS_SECRET_ACCESS_KEY} characters |"
            echo "| Found under BACKUP_ACCESS_KEY | ${NAMED_BACKUP_ACCESS_KEY} |"
            echo "| Found under SPACES_ACCESS_KEY | ${NAMED_SPACES_ACCESS_KEY} |"
            echo "| Found under AWS_ACCESS_KEY_ID | ${NAMED_AWS_ACCESS_KEY_ID} |"
            echo "| Bundle | $(du -h "piperstitch-proofs-${STAMP}.bundle" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            {
              echo ""
              echo "**No credentials reached this job.** The keys are empty, so the AWS CLI had nothing"
              echo "to sign with — its advice to run \`aws login\` is misleading here; there is no login."
              echo ""
              echo "In this repository: **Settings → Secrets and variables → Actions**, and check that"
              echo "\`BACKUP_ACCESS_KEY\` and \`BACKUP_SECRET_KEY\` are under the **Secrets** tab, in the"
              echo "**Repository secrets** section — not under the **Variables** tab beside it, not"
              echo "Environment secrets, and not Dependabot secrets. Names look the same in all of them."
              echo ""
              echo "They are per-repository: a set added to piperstitch-proofs is invisible here."
              echo ""
              echo "This job also accepts the names \`BACKUP_ACCESS_KEY_ID\`, \`SPACES_ACCESS_KEY\`,"
              echo "\`SPACES_KEY\`, \`AWS_ACCESS_KEY_ID\` and \`DO_SPACES_KEY\` (and the matching secret-key"
              echo "spellings), so a near-miss on the name is already covered. If none of those matched,"
              echo "the value itself is empty — re-paste it, since a secret cannot be read back to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No credentials reached this job — see the run summary."
            exit 1
          fi

          echo "Checking the bucket is reachable with these credentials..."
          if ! probe="$(aws --endpoint-url "$ENDPOINT" s3 ls "s3://$BUCKET" 2>&1)"; then
            {
              echo ""
              echo "**The bucket refused those credentials.** What it said:"
              echo ""
              echo '```'
              echo "$probe"
              echo '```'
              echo ""
              echo "Usually one of: the secrets aren't set on *this* repository (they are per-repository);"
              echo "a stray space when pasting; the region not matching the endpoint's datacentre; or the"
              echo "bucket name being inside BACKUP_ENDPOINT, where it doesn't belong."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Could not reach s3://$BUCKET — see the run summary for what the bucket said."
            echo "$probe"
            exit 1
          fi
          echo "Reachable. Uploading..."

          # Above 8 MB the CLI splits an object into a multipart upload,
          # and that is where DigitalOcean Spaces still refuses the
          # checksums it insists on sending. This repository's bundle is
          # ~50 MB (the videos), Proofs' is under a megabyte — which is
          # why the identical job succeeded there and failed here. A
          # single PUT handles up to 5 GB, so raise the threshold and
          # send it in one piece.
          aws configure set default.s3.multipart_threshold 4GB
          aws configure set default.s3.multipart_chunksize 4GB
          set -e
          aws --endpoint-url "$ENDPOINT" s3 cp "piperstitch-proofs-${STAMP}.bundle" "s3://$BUCKET/repository/proofs/piperstitch-proofs-${STAMP}.bundle"
          aws --endpoint-url "$ENDPOINT" s3 cp "piperstitch-proofs-${STAMP}.bundle.sha256" "s3://$BUCKET/repository/proofs/piperstitch-proofs-${STAMP}.bundle.sha256"
          # Read it back: an upload nobody checked is a belief, not a backup.
          aws --endpoint-url "$ENDPOINT" s3 cp "s3://$BUCKET/repository/proofs/piperstitch-proofs-${STAMP}.bundle" check.bundle
          test "$(sha256sum check.bundle | cut -d' ' -f1)" = "$(cut -d' ' -f1 "piperstitch-proofs-${STAMP}.bundle.sha256")"
          git bundle verify check.bundle
          echo "Verified: the bundle in the bucket is a complete, clonable repository."

      - name: Keep the last twelve
        env:
          # Whichever name these were saved under. The bucket arrived while
          # these did not, which means the names differ rather than the
          # secrets being absent.
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY || secrets.BACKUP_ACCESS_KEY_ID || secrets.SPACES_ACCESS_KEY || secrets.SPACES_KEY || secrets.AWS_ACCESS_KEY_ID || secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_KEY || secrets.BACKUP_SECRET_ACCESS_KEY || secrets.SPACES_SECRET_KEY || secrets.SPACES_SECRET || secrets.AWS_SECRET_ACCESS_KEY || secrets.DO_SPACES_SECRET }}
          NAMED_BACKUP_ACCESS_KEY: ${{ secrets.BACKUP_ACCESS_KEY != '' }}
          NAMED_SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY != '' }}
          NAMED_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_REGION || vars.BACKUP_REGION || 'us-east-1' }}
          ENDPOINT: ${{ secrets.BACKUP_ENDPOINT || vars.BACKUP_ENDPOINT }}
          BUCKET: ${{ secrets.BACKUP_BUCKET || vars.BACKUP_BUCKET }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          if [ -z "${BUCKET:-}" ]; then
            exit 0
          fi
          keys="$(aws --endpoint-url "$ENDPOINT" s3 ls "s3://$BUCKET/repository/proofs/" | awk '{print $4}' | grep '\.bundle$' | sort)"
          count="$(echo "$keys" | wc -l)"
          if [ "$count" -gt 12 ]; then
            echo "$keys" | head -n "$((count - 12))" | while read -r old; do
              aws --endpoint-url "$ENDPOINT" s3 rm "s3://$BUCKET/repository/proofs/$old" "s3://$BUCKET/repository/proofs/$old.sha256" || true
            done
          fi
